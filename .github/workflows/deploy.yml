# دبّر — فحص كامل ثم نشر على GitHub Pages: https://azoxj.github.io/dabbir/
# - كل push (أي فرع) وكل PR: الفحوصات + اختبارات Supabase حقيقية (محلية داخل الـ runner).
# - النشر من main فقط، وبعد نجاح كل الوظائف.
# مجاني بالكامل للمستودعات العامة.
name: CI & Deploy (GitHub Pages)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, unit + DB tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed env files contain public values only
        run: npm run check:env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: RLS / database tests (throwaway local PostgreSQL)
        run: npm run test:rls
      - name: Build
        run: npm run build
        env:
          # قيم عامة فقط (Project URL + Publishable/anon key) من: Settings → Secrets and variables → Actions → Variables.
          # فارغة ← يُبنى التطبيق بالوضع التجريبي. لا تضع service_role هنا أبدًا (التطبيق يرفضه على أي حال).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE || '/dabbir/' }}
      - name: Guard — no secret keys in the bundle
        run: |
          if grep -rEl "sb_secret_[A-Za-z0-9]{8,}" dist; then echo "::error::secret key found in dist"; exit 1; fi
          for f in $(grep -rlE "eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}" dist || true); do
            for t in $(grep -oE "eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}" "$f"); do
              p=$(echo "$t" | cut -d. -f2 | tr '_-' '/+'); while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
              if echo "$p" | base64 -d 2>/dev/null | grep -q '"role":"service_role"'; then echo "::error::service_role key in $f"; exit 1; fi
            done
          done
          echo "no secret keys in dist"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  supabase:
    name: Supabase integration + browser E2E (iPhone/Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase (Postgres + GoTrue + PostgREST + Mailpit)
        run: npm run supabase:start
      - name: Integration tests (auth, sessions, CRUD, sync, RLS with two users)
        run: npm run test:integration
      - name: Build against local Supabase
        run: npm run build:local
      - name: Browser E2E against local Supabase
        run: npm run test:e2e:supabase
      - name: Build (demo mode) + demo/GitHub Pages E2E
        run: npm run build && npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose -f supabase/local/docker-compose.yml --env-file supabase/local/.env logs --tail 80 auth rest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots
          retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, supabase]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
